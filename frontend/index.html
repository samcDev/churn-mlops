<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Churn | UAGRM</title>
<style>body{font:18px system-ui;background:#0c1829;color:#e5edf9;max-width:780px;margin:50px auto;padding:20px}form{display:grid;gap:16px;background:#182b44;padding:28px;border-radius:18px}label{display:grid;gap:5px}input,select,button{font:inherit;padding:10px;border-radius:8px;border:0}button{background:#5ee4b1;color:#102436;cursor:pointer}pre{white-space:pre-wrap}small{color:#a6bdd8}</style>
<small>UAGRM · PROYECTO INDIVIDUAL MLOPS</small><h1>Riesgo de abandono</h1><p>Predicción de churn con trazabilidad del modelo y del Pod.</p>
<form id="form"><label>Antigüedad en meses<input name="tenure" type="number" value="12" min="0" max="100" required></label><label>Cargo mensual<input name="MonthlyCharges" type="number" value="75" step=".01" min="0" max="1000" required></label><label>Total acumulado<input name="TotalCharges" type="number" value="900" step=".01" min="0" max="100000" required></label><label>Contrato<select name="Contract"><option>Month-to-month</option><option>One year</option><option>Two year</option></select></label><label>Internet<select name="InternetService"><option>Fiber optic</option><option>DSL</option><option>No</option></select></label><label>Pago<select name="PaymentMethod"><option>Electronic check</option><option>Mailed check</option><option>Bank transfer (automatic)</option><option>Credit card (automatic)</option></select></label><button>Consultar API</button></form><pre id="result" aria-live="polite"></pre>
<script>document.getElementById('form').onsubmit=async(e)=>{e.preventDefault();const out=document.getElementById('result');out.textContent='Consultando…';try{const payload=Object.fromEntries(new FormData(e.target));for(const k of ['tenure','MonthlyCharges','TotalCharges'])payload[k]=Number(payload[k]);const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));out.textContent=`Probabilidad: ${(100*d.probability).toFixed(1)}%\nAbandono estimado: ${d.churn?'Sí':'No'}\nModelo: ${d.name} v${d.version} @${d.alias}\nPod: ${d.pod}\nRun: ${d.run_id}`;}catch(err){out.textContent='Error: '+err.message;}};</script></html>
