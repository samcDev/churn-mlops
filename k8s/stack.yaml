apiVersion: v1
kind: Namespace
metadata:
  name: churn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-state
  namespace: churn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: churn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mlflow}
  template:
    metadata:
      labels: {app: mlflow}
    spec:
      containers:
        - name: mlflow
          image: churn-mlflow:1.0.0
          imagePullPolicy: Never
          ports: [{containerPort: 5000}]
          volumeMounts: [{name: state, mountPath: /mlflow/state}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: mlflow-state}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: churn
spec:
  type: NodePort
  selector: {app: mlflow}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30500}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
  namespace: churn
spec:
  replicas: 3
  selector:
    matchLabels: {app: churn-api}
  template:
    metadata:
      labels: {app: churn-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: churn-api:1.0.0
          imagePullPolicy: Never
          env:
            - {name: MLFLOW_TRACKING_URI, value: 'http://mlflow:5000'}
            - {name: MODEL_ALIAS, value: production}
          ports: [{containerPort: 8000}]
          startupProbe:
            httpGet: {path: /ready, port: 8000}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: churn-api
  namespace: churn
spec:
  type: NodePort
  sessionAffinity: None
  selector: {app: churn-api}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]
